<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Lorenzo Ferraioli</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { --bg: #0d1b2a; --text: #e0e1dd; --muted: #8d99ae; --accent: #f05454; --up: #3ddc84; }
    @media (prefers-color-scheme: light) { :root { --bg: #fcfcfb; --text: #0d1b2a; --muted: #5c677d; --accent: #c0262d; --up: #0f7a3f; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    .code { font: 700 clamp(4rem, 18vw, 7rem)/1 ui-monospace, monospace; color: var(--accent); margin: 0; }
    .tick { font-family: ui-monospace, monospace; color: var(--accent); }
    p { color: var(--muted); max-width: 30rem; margin: 1rem auto; }
    a { display: inline-block; margin-top: 0.5rem; padding: 0.75rem 1.3rem; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p><span class="tick">LRNZ ▼ page not found.</span><br />This page doesn't exist (yet). The hawk flew elsewhere 🦅</p>
    <a href="/">← Back to the home page</a>
  </main>
</body>
</html>
